<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цветочный подвес — кольцо с полочками</title>
<style>
  :root{
    --bg:#16181b; --panel:#1e2125; --line:#2e3238; --text:#d8dadd; --muted:#8a9099;
    --accent:#e0a040; --ok:#7fbf7f; --warn:#e06060;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
  .app{display:grid;grid-template-columns:340px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 16px}
  h1{font-size:16px;margin:0 0 2px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);
    margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .row{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px;margin:5px 0}
  .row label{color:var(--muted)}
  input[type=number],select{width:100%;background:#121417;color:var(--text);border:1px solid var(--line);
    border-radius:4px;padding:4px 6px;font:inherit;text-align:right}
  select{text-align:left}
  input[type=range]{width:100%}
  .chk{display:flex;gap:8px;align-items:center;margin:5px 0;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:normal}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .segs{display:flex;gap:6px;flex-wrap:wrap}
  .segs button{flex:1;min-width:56px;background:#121417;color:var(--text);border:1px solid var(--line);
    border-radius:4px;padding:5px 0;cursor:pointer;font:inherit}
  .segs button.on{border-color:var(--accent);color:var(--accent)}
  .note{color:var(--muted);font-size:12px;margin:6px 0}
  main{position:relative;display:flex;flex-direction:column;min-width:0}
  .tabs{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 10px}
  .tabs button{background:none;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;font:inherit;
    border-bottom:2px solid transparent}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .tabs .sp{flex:1}
  .view{flex:1;position:relative;min-height:0}
  #v3d,#v2d,#vdxf{position:absolute;inset:0}
  #v2d{display:none;overflow:auto;background:#f4f3ef;color:#222}
  #v2d svg{display:block;margin:0 auto}
  #vdxf{display:none;overflow:auto;background:#e8e6e0;color:#222;padding:16px 20px}
  #vdxf h3{margin:22px 0 8px;font-size:15px}
  #vdxf .hint{color:#666;font-size:12px;margin:0 0 14px;max-width:900px;line-height:1.5}
  #vdxf .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
    padding:10px 12px;background:#fff;border:1px solid #d5d2c9;border-radius:6px}
  #vdxf .bar b{font-size:14px}
  #vdxf .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
  #vdxf .card{background:#fff;border:1px solid #d5d2c9;border-radius:6px;padding:12px}
  #vdxf .card h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;
    align-items:baseline;gap:10px}
  #vdxf .card h4 span{font-weight:400;color:#666;font-size:12px}
  #vdxf .card svg{width:100%;height:auto;border:1px solid #ddd;background:#fff;display:block}
  #vdxf .card .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  #vdxf .card .row small{color:#666}
  .hud{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;pointer-events:none}
  .lbl{color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:3px;font-size:12px;
    border:1px solid rgba(224,160,64,.6)}
  .btn{background:#121417;color:var(--text);border:1px solid var(--line);border-radius:4px;
    padding:6px 10px;cursor:pointer;font:inherit;margin:8px 6px 0 0}
  .btn:hover{border-color:var(--accent)}
  .btn.sm{padding:2px 7px;margin:0;font-size:12px}
  #shTable input{width:50px;padding:2px 4px;font-size:12px}
  #shTable td{padding:2px 3px}
  .warn{color:var(--warn);font-size:12px;margin:6px 0}
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
}}
</script>
</head>
<body>
<div class="app">
<aside>
  <h1>Цветочный подвес</h1>
  <div class="sub">Кольцо из полосы + уголки с полочками и ограждением</div>

  <h2>Кольцо</h2>
  <div class="row"><label>Наружный диаметр D, мм</label><input id="D" type="number" value="600" min="200" max="2000" step="10"></div>
  <div class="row"><label>Высота полосы H, мм</label><input id="H" type="number" value="40" min="10" max="200" step="1"></div>
  <div class="row"><label>Толщина полосы t, мм</label><input id="t" type="number" value="2" min="1" max="10" step="0.5"></div>
  <div class="row"><label>Число сегментов n</label><input id="n" type="number" value="4" min="2" max="12" step="1"></div>
  <div class="row"><label>Зазор в стыке, мм</label><input id="gap" type="number" value="2" min="0" max="20" step="0.5"></div>
  <div class="row"><label>Материал</label>
    <select id="mat">
      <option value="7850">Ст3сп (S235)</option>
      <option value="7850">Сталь 08пс</option>
      <option value="7850">Сталь 20</option>
    </select></div>

  <h2>Стыки (накладки)</h2>
  <div class="row"><label>Длина накладки Lн, мм</label><input id="Lp" type="number" value="80" min="30" max="200" step="1"></div>
  <div class="row"><label>Отступ отв. от торца e, мм</label><input id="e" type="number" value="10" min="5" max="40" step="1"></div>
  <div class="row"><label>Крепёж стыков</label>
    <select id="bolt">
      <option value="4">M4 (отв. Ø4.5)</option>
      <option value="5" selected>M5 (отв. Ø5.5)</option>
      <option value="6">M6 (отв. Ø6.6)</option>
    </select></div>
  <label class="chk"><input id="lugs" type="checkbox" checked> Проушина на накладке (точка подвеса)</label>

  <h2>Уголок (Г, перевёрнутая)</h2>
  <div class="row"><label>Толщина уголка, мм</label><input id="angT" type="number" value="2" min="1" max="6" step="0.5"></div>
  <div class="row"><label>Ширина полок, мм</label><input id="angA" type="number" value="30" min="10" max="100" step="1"></div>
  <div class="row"><label>Длина гориз. полки, мм</label><input id="angB" type="number" value="35" min="10" max="120" step="1"></div>
  <div class="row"><label>Выпуск стойки вниз, мм</label><input id="angDrop" type="number" value="150" min="30" max="600" step="5"></div>
  <div class="row"><label>Уголков на полочку</label><input id="angN" type="number" value="2" min="1" max="4" step="1"></div>
  <div class="row"><label>Расст. между уголками, мм</label><input id="angSpan" type="number" value="40" min="0" max="400" step="5"></div>

  <h2>Полочка и ограждение</h2>
  <div class="row"><label>Толщина полочки, мм</label><input id="shT" type="number" value="2" min="1" max="6" step="0.5"></div>
  <div class="row"><label>Пруток ограждения Ø, мм</label><input id="rodD" type="number" value="6" min="3" max="20" step="1"></div>
  <div class="row"><label>Высота столбиков, мм</label><input id="postH" type="number" value="40" min="10" max="200" step="1"></div>

  <h2>Полочки</h2>
  <table id="shTable"></table>
  <button class="btn sm" id="addSh">+ полочка</button>
  <button class="btn sm" id="spreadSh">По сегментам</button>
  <div class="warn" id="warn"></div>

  <h2>Подвес</h2>
  <div class="row"><label>Высота подвеса, мм</label><input id="hang" type="number" value="550" min="150" max="2000" step="10"></div>
  <label class="chk"><input id="chains" type="checkbox" checked> Показать цепи и крюк</label>
  <label class="chk"><input id="plants" type="checkbox"> Показать растения (условно)</label>

  <h2>Вид</h2>
  <div class="row"><label>Разнесённый вид</label><input id="explode" type="range" min="0" max="120" value="0"></div>
  <div class="segs" id="segBtns"></div>

  <h2>Расчёт</h2>
  <table id="calc"></table>

  <h2>Спецификация</h2>
  <table id="spec"></table>
  <div class="note" id="tech"></div>
  <button class="btn" id="dl">Скачать чертёж (SVG)</button>
</aside>

<main>
  <div class="tabs">
    <button class="on" data-tab="3d">3D модель</button>
    <button data-tab="2d">Чертёж</button>
    <button data-tab="dxf">Чертежи DXF</button>
    <span class="sp"></span>
  </div>
  <div class="view">
    <div id="v3d"></div>
    <div id="v2d"></div>
    <div id="vdxf"></div>
    <div class="hud" id="hud">ЛКМ — вращение · ПКМ — сдвиг · колесо — масштаб</div>
  </div>
</main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { buildSheets, toDXF, toSVG, zipSync } from './dxf.js';

const $ = id => document.getElementById(id);
const HOLE = { 4: 4.5, 5: 5.5, 6: 6.6 };
const LUG = { w: 24, h: 28, hole: 9 };
let selected = -1;

// полочки: угол на кольце (град), глубина (внутрь по радиусу), ширина (тангенц.), число столбиков
let shelves = [
  { ang: 45,  depth: 150, width: 150, posts: 6 },
  { ang: 135, depth: 150, width: 150, posts: 6 },
  { ang: 225, depth: 150, width: 150, posts: 6 },
  { ang: 315, depth: 150, width: 150, posts: 6 },
];

// ---------------- Параметры и расчёт ----------------
function params() {
  const p = {
    D: +$('D').value, H: +$('H').value, t: +$('t').value, n: Math.round(+$('n').value),
    gap: +$('gap').value, rho: +$('mat').value, mat: $('mat').selectedOptions[0].text,
    Lp: +$('Lp').value, e: +$('e').value, bolt: +$('bolt').value,
    lugs: $('lugs').checked, hang: +$('hang').value,
    chains: $('chains').checked, plants: $('plants').checked, explode: +$('explode').value,
    angT: +$('angT').value, angA: +$('angA').value, angB: +$('angB').value,
    angDrop: +$('angDrop').value, angN: Math.max(1, Math.round(+$('angN').value)),
    angSpan: +$('angSpan').value,
    rodD: +$('rodD').value, shT: +$('shT').value,
    postH: +$('postH').value,
  };
  p.Ro = p.D / 2; p.Ri = p.Ro - p.t; p.Rm = p.Ro - p.t / 2;
  p.dHole = HOLE[p.bolt];
  p.Cm = Math.PI * 2 * p.Rm;
  p.L = (p.Cm - p.n * p.gap) / p.n;
  p.segAng = p.L / p.Rm;
  p.pitch = 2 * Math.PI / p.n;
  p.chord = 2 * p.Ro * Math.sin(p.segAng / 2);
  p.sag = p.Ro * (1 - Math.cos(p.segAng / 2));
  p.half = (p.Lp - p.gap) / 2;
  p.holes = [p.e, p.half - p.e];
  p.Rp = p.Ri - p.t / 2;
  const kg = mm3 => mm3 * p.rho * 1e-9;

  p.mSeg = kg(p.L * p.H * p.t);
  const lugArea = p.lugs ? (LUG.w * (LUG.h - LUG.w / 2) + Math.PI * (LUG.w / 2) ** 2 / 2 - Math.PI * (LUG.hole / 2) ** 2) : 0;
  p.mPlate = kg((p.Lp * p.H - 4 * Math.PI * (p.dHole / 2) ** 2 + lugArea) * p.t);
  p.mRing = p.n * (p.mSeg + p.mPlate);

  // уголок: Г-образный профиль из полосы t; стойка вниз + горизонтальная полка
  p.angArea = (p.angDrop + p.angB - p.angT) * p.angT;   // мм² — сечение Г
  p.mBracket = kg(p.angArea * p.angA);                  // объём = сечение × ширина полок

  p.shelves = shelves.map(s => {
    const o = { ...s };
    o.ins = p.rodD / 2 + 3;                                  // отступ ограждения от края
    o.perim = 2 * ((o.depth - 2 * o.ins) + (o.width - 2 * o.ins));
    o.rodLen = o.posts * p.postH + 2 * o.perim;
    o.brackets = p.angN;
    o.mBracket = p.mBracket * p.angN;
    o.mShelf = kg(o.depth * o.width * p.shT);
    o.mRod = kg(o.rodLen * Math.PI * p.rodD ** 2 / 4);
    o.mTotal = o.mBracket + o.mShelf + o.mRod;
    o.a = o.ang * Math.PI / 180;
    return o;
  });
  p.mTotal = p.mRing + p.shelves.reduce((a, s) => a + s.mTotal, 0);
  p.bolts = p.n * 4 + p.shelves.length * (p.angN * 2 + 2);   // стыки + уголки + полочка
  // окраска: кольцо (2 стороны + 2 кромки) + полочки (2 стороны + 4 кромки) + уголки
  p.paintRing = (2 * p.Cm * p.H + 2 * p.Cm * p.t) / 1e6;
  p.paintSh = p.shelves.reduce((a, s) =>
    a + (2 * s.depth * s.width + 2 * (s.depth + s.width) * p.shT) / 1e6, 0);
  p.angPerim = p.angDrop + p.angB + 2 * p.angT;             // периметр профиля Г, мм
  p.paintAng = p.shelves.length * p.angN * p.angPerim * p.angA * 2 / 1e6;
  p.paint = p.paintRing + p.paintSh + p.paintAng;
  return p;
}

const fmt = (v, d = 1) => v.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });

function renderTables(p) {
  const rows = [
    ['Средний диаметр Dср', fmt(2 * p.Rm, 1) + ' мм'],
    ['Развёртка сегмента L', fmt(p.L, 1) + ' мм'],
    ['Угол сегмента', fmt(p.segAng * 180 / Math.PI, 2) + '°'],
    ['Хорда / стрела', fmt(p.chord, 1) + ' / ' + fmt(p.sag, 1) + ' мм'],
    ['R/t (гибка)', fmt(p.Rm / p.t, 0) + (p.Rm / p.t > 25 ? ' — вальцовка' : ' — гибка')],
    ['Масса кольца', fmt(p.mRing, 2) + ' кг'],
    ['Масса уголка', fmt(p.mBracket, 3) + ' кг × ' + (p.shelves.length * p.angN)],
    ['Масса полочки', p.shelves.length ? fmt(p.shelves[0].mShelf, 3) + ' кг × ' + p.shelves.length : '—'],
    ['Пруток на полочку', p.shelves.length ? fmt(p.shelves[0].rodLen / 1000, 2) + ' м × ' + p.shelves.length : '—'],
    ['Масса изделия', fmt(p.mTotal, 2) + ' кг'],
    ['Крепёж всего', p.bolts + ' шт M' + p.bolt],
    ['Площадь покраски', fmt(p.paint, 3) + ' м² (кольцо ' + fmt(p.paintRing, 3) + ')'],
  ];
  $('calc').innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('');

  const spec = [
    ['1', `Сегмент кольца, полоса ${p.t}×${p.H}, L=${fmt(p.L, 1)}`, p.n, p.mSeg],
    ['2', `Накладка${p.lugs ? ' с проушиной' : ''}, ${p.t}×${p.H}×${p.Lp}`, p.n, p.mPlate],
    ['3', `Уголок ${p.angT}×${p.angA}, стойка ${p.angDrop} мм (Г, перевёрнутая)`, p.shelves.length * p.angN, p.mBracket],
    ['4', `Полочка плоская, ${p.shT} мм, размеры по табл.`, p.shelves.length, p.shelves.length ? p.shelves[0].mShelf : 0],
    ['5', `Пруток ограждения Ø${p.rodD}, L=… (табл. полочек)`, p.shelves.length, p.shelves.length ? p.shelves[0].mRod : 0],
    ['6', `Винт M${p.bolt}×${2 * p.t + 8} DIN 7985`, p.bolts, null],
    ['7', `Гайка M${p.bolt} DIN 985 (самоконтр.)`, p.bolts, null],
    ['8', `Шайба ${p.bolt} DIN 125`, p.bolts * 2, null],
  ];
  if (p.lugs && p.chains) spec.push(['9', `Цепь подвеса ~${fmt(chainLen(p), 0)} мм`, p.n, null],
    ['10', 'Кольцо-сборник Ø40 + крюк', 1, null]);
  $('spec').innerHTML = '<tr><th>Поз.</th><th>Наименование</th><th>Кол.</th><th>кг</th></tr>' +
    spec.map(s => `<tr><td>${s[0]}</td><td>${s[1]}</td><td class="n">${s[2]}</td><td class="n">${s[3] ? fmt(s[3] * s[2], 2) : '—'}</td></tr>`).join('');

  // предупреждение: полочка попадает на стык
  const w = [];
  for (const s of p.shelves) {
    for (let j = 0; j < p.n; j++) {
      const ja = j * p.pitch * 180 / Math.PI;
      const d = Math.abs(((s.ang - ja) % 360 + 540) % 360 - 180);
      if (d < 8) { w.push(`Полочка на ${fmt(s.ang, 0)}° попадает на стык (${fmt(ja, 0)}°) — сдвиньте на ≥10°`); break; }
    }
  }
  $('warn').innerHTML = w.join('<br>');

  $('tech').innerHTML = `Кольцо: ${p.mat}, полоса ${p.t}×${p.H}; вальцовка по R${fmt(p.Ro, 0)} (наружн.).<br>
    Уголок: стойка снаружи кольца, выпуск ${p.angDrop} мм вниз, горизонтальная полка ${p.angB} мм внутрь под полочку; гнуть по R${fmt(p.angT * 1.5, 1)} мм. Крепление стойки к кольцу 2×M${p.bolt} сквозь полосу.<br>
    Полочка: лист/полоса ${p.shT} мм, крепление 2×M${p.bolt} к горизонтальной полке уголка.<br>
    Ограждение: пруток Ø${p.rodD}, столбики приварены к полочке, пруток загибается/приваривается по месту.<br>
    Отверстия сверлить в сборе. Покрытие: порошок RAL 9005 по фосфатированию. Откл. ±0,5 мм.`;
}

function chainLen(p) {
  const r = p.Rp, dy = p.hang - LUG.h;
  return Math.hypot(r - 20, dy);
}

// ---------------- Таблица полочек ----------------
function renderShelfTable() {
  const t = $('shTable');
  let html = '<tr><th>№</th><th>Угол°</th><th>Глуб.</th><th>Ширина</th><th>Столб.</th><th></th></tr>';
  shelves.forEach((s, i) => {
    html += `<tr data-i="${i}"><td>${i + 1}</td>` +
      `<td><input type="number" data-k="ang" value="${s.ang}" step="5"></td>` +
      `<td><input type="number" data-k="depth" value="${s.depth}" step="10"></td>` +
      `<td><input type="number" data-k="width" value="${s.width}" step="10"></td>` +
      `<td><input type="number" data-k="posts" value="${s.posts}" step="1" min="0"></td>` +
      `<td><button class="btn sm" data-del="${i}">✕</button></td></tr>`;
  });
  t.innerHTML = html;
  t.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = +inp.closest('tr').dataset.i, k = inp.dataset.k;
      shelves[i][k] = k === 'posts' ? Math.max(0, Math.round(+inp.value)) : +inp.value;
      build();
    });
  });
  t.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    shelves.splice(+b.dataset.del, 1); renderShelfTable(); build();
  });
}
$('addSh').onclick = () => {
  const used = shelves.map(s => s.ang);
  let ang = 0;
  for (let a = 0; a < 360; a += 15) if (!used.some(u => Math.abs(u - a) < 20)) { ang = a; break; }
  shelves.push({ ang, depth: 150, width: 150, posts: 6 });
  renderShelfTable(); build();
};
$('spreadSh').onclick = () => {
  const n = Math.max(1, Math.round(+$('n').value));
  shelves.forEach((s, i) => s.ang = Math.round((i * 360 / n + 180 / n) * 10) / 10);
  renderShelfTable(); build();
};

// ---------------- 3D ----------------
const host = $('v3d');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.style.position = 'absolute'; labelR.domElement.style.inset = '0'; labelR.domElement.style.pointerEvents = 'none';
host.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c20);
const camera = new THREE.PerspectiveCamera(40, 1, 5, 20000);
camera.position.set(900, 700, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 200, 0); controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe6ef, 0x30302c, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(600, 1400, 500); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -900, right: 900, top: 900, bottom: -900, near: 10, far: 4000 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fb4ff, 0.6); fill.position.set(-800, 300, -600); scene.add(fill);

const floor = new THREE.Mesh(new THREE.CircleGeometry(1400, 64), new THREE.MeshStandardMaterial({ color: 0x24272b, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -250; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(2400, 24, 0x3a3f46, 0x2b2f35); grid.position.y = -249; scene.add(grid);

const matSteel = new THREE.MeshStandardMaterial({ color: 0x45484e, metalness: 0.7, roughness: 0.4 });
const matSel = new THREE.MeshStandardMaterial({ color: 0x8a5a14, metalness: 0.6, roughness: 0.35, emissive: 0x3a2000 });
const matPlate = new THREE.MeshStandardMaterial({ color: 0x3c4047, metalness: 0.8, roughness: 0.35 });
const matBracket = new THREE.MeshStandardMaterial({ color: 0x5a6069, metalness: 0.75, roughness: 0.38 });
const matShelf = new THREE.MeshStandardMaterial({ color: 0x4e535b, metalness: 0.7, roughness: 0.45 });
const matRod = new THREE.MeshStandardMaterial({ color: 0xa8aeb6, metalness: 1, roughness: 0.25 });
const matBolt = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 1, roughness: 0.25 });
const matChain = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 1, roughness: 0.3 });

let model = new THREE.Group(); scene.add(model);
let segMeshes = [];

// кольцевой сектор: радиусы r1<r2, углы a0..a1, высота h (ось Y вверх)
function sector(r1, r2, a0, a1, h) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r2, a0, a1, false);
  s.lineTo(r1 * Math.cos(a1), r1 * Math.sin(a1));
  s.absarc(0, 0, r1, a1, a0, true);
  s.closePath();
  const steps = Math.max(8, Math.ceil((a1 - a0) / 0.02));
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: steps });
  g.rotateX(-Math.PI / 2);
  return g;
}

function lugGeometry(t) {
  const s = new THREE.Shape(), w = LUG.w / 2, hs = LUG.h - w;
  s.moveTo(-w, -2); s.lineTo(w, -2); s.lineTo(w, hs);
  s.absarc(0, hs, w, 0, Math.PI, false); s.lineTo(-w, -2);
  const hole = new THREE.Path(); hole.absarc(0, hs, LUG.hole / 2, 0, Math.PI * 2, true);
  s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 24 });
  g.rotateY(Math.PI / 2);
  return g;
}

// цилиндр между двумя точками
function rodBetween(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
  if (len < 0.01) return null;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 12), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true;
  return m;
}

// точки по периметру прямоугольника, равномерно по длине
function perimeterPoints(xA, xB, zA, zB, n) {
  const pts = [[xA, zA], [xA, zB], [xB, zB], [xB, zA]];
  const lens = [
    Math.abs(zB - zA), Math.abs(xB - xA), Math.abs(zB - zA), Math.abs(xB - xA)
  ];
  const total = lens.reduce((a, b) => a + b, 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    let d = (i / n) * total, k = 0;
    while (k < 3 && d > lens[k]) { d -= lens[k]; k++; }
    const t = lens[k] ? d / lens[k] : 0;
    const a = pts[k], b = pts[(k + 1) % 4];
    out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
  }
  return out;
}

function build() {
  const p = params();
  renderTables(p);
  scene.remove(model);
  model.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.element) o.element.remove(); });
  model = new THREE.Group(); segMeshes = [];
  const ex = p.explode;

  // --- сегменты кольца
  for (let i = 0; i < p.n; i++) {
    const c = i * p.pitch + p.pitch / 2;
    const a0 = c - p.segAng / 2, a1 = c + p.segAng / 2;
    const g = new THREE.Group();
    const m = new THREE.Mesh(sector(p.Ri, p.Ro, a0, a1, p.H), i === selected ? matSel : matSteel);
    m.castShadow = m.receiveShadow = true; g.add(m); segMeshes.push(m);
    g.position.set(Math.cos(c) * ex, 0, -Math.sin(c) * ex);
    const lab = document.createElement('div'); lab.className = 'lbl'; lab.textContent = 'С' + (i + 1);
    const lo = new CSS2DObject(lab); lo.position.set(Math.cos(c) * (p.Ro + 40), p.H + 10, -Math.sin(c) * (p.Ro + 40));
    g.add(lo);
    model.add(g);
  }

  // --- стыки (накладки)
  for (let j = 0; j < p.n; j++) {
    const aj = j * p.pitch;
    const g = new THREE.Group(); g.rotation.y = aj;
    const pl = p.Lp / p.Ri;
    const plate = new THREE.Mesh(sector(p.Ri - p.t, p.Ri, -pl / 2, pl / 2, p.H), matPlate);
    plate.castShadow = true; g.add(plate);
    if (p.lugs) {
      const lug = new THREE.Mesh(lugGeometry(p.t), matPlate);
      lug.position.set(p.Ri - p.t, p.H, 0); lug.castShadow = true; g.add(lug);
    }
    const bg = new THREE.CylinderGeometry(p.bolt * 0.9, p.bolt * 0.9, 3, 16); bg.rotateZ(Math.PI / 2);
    const sg = new THREE.CylinderGeometry(p.bolt / 2, p.bolt / 2, 2 * p.t + 8, 12); sg.rotateZ(Math.PI / 2);
    const ng = new THREE.CylinderGeometry(p.bolt * 0.95, p.bolt * 0.95, p.bolt * 0.8, 6); ng.rotateZ(Math.PI / 2);
    for (const side of [-1, 1]) for (const d of p.holes) {
      const ang = side * (p.gap / 2 + d) / p.Rm;
      const pos = r => new THREE.Vector3(Math.cos(ang) * r, p.H / 2, -Math.sin(ang) * r);
      const head = new THREE.Mesh(bg, matBolt), sh = new THREE.Mesh(sg, matBolt), nut = new THREE.Mesh(ng, matBolt);
      head.position.copy(pos(p.Ro + 1.5)); head.rotation.y = ang;
      sh.position.copy(pos(p.Ri - p.t / 2 - 1)); sh.rotation.y = ang;
      nut.position.copy(pos(p.Ri - p.t - p.bolt * 0.4)); nut.rotation.y = ang;
      g.add(head, sh, nut);
    }
    model.add(g);
  }

  // --- уголки (стойка вниз) + полочки + ограждения
  p.shelves.forEach((s, idx) => {
    const g = new THREE.Group(); g.rotation.y = s.a;
    const t = p.angT, A = p.angA, B = p.angB, Drop = p.angDrop;
    const xOut = p.Ro;                     // наружная поверхность кольца (локальная X)
    const shW = s.depth, shD = s.width, shT = p.shT;
    // уровень горизонтальной полки уголка — под полочкой
    const shelfBottom = -Drop;             // низ полочки
    const hLegY = shelfBottom - t;         // центр горизонтальной полки уголка

    // число уголков на полочку и их шаг поперёк
    const nBr = Math.max(1, p.angN);
    let brZ;
    if (nBr === 1) brZ = [0];
    else {
      const step = Math.min(p.angSpan, shD - A);
      brZ = [];
      for (let i = 0; i < nBr; i++) brZ.push(-step * (nBr - 1) / 2 + i * step);
    }
    brZ.forEach(dz => {
      // вертикальная стойка уголка — снаружи кольца, идёт вниз
      const vLeg = new THREE.Mesh(new THREE.BoxGeometry(t, Drop, A), matBracket);
      vLeg.position.set(xOut + t / 2, -Drop / 2, dz); vLeg.castShadow = true; g.add(vLeg);
      // горизонтальная полка уголка — наружу, под полочку (несёт её)
      const hLeg = new THREE.Mesh(new THREE.BoxGeometry(B, t, A), matBracket);
      hLeg.position.set(xOut + t + B / 2, hLegY, dz); hLeg.castShadow = true; g.add(hLeg);
    });

    // болты уголка к кольцу (по 2 на стойку, сквозь кольцо снаружи)
    const bg = new THREE.CylinderGeometry(p.bolt * 0.9, p.bolt * 0.9, 3, 16); bg.rotateZ(Math.PI / 2);
    const sg = new THREE.CylinderGeometry(p.bolt / 2, p.bolt / 2, p.t + t + 8, 12); sg.rotateZ(Math.PI / 2);
    const ng = new THREE.CylinderGeometry(p.bolt * 0.95, p.bolt * 0.95, p.bolt * 0.8, 6); ng.rotateZ(Math.PI / 2);
    brZ.forEach(dz => {
      for (const by of [p.H * 0.3, p.H * 0.7]) {
        const head = new THREE.Mesh(bg, matBolt), sh = new THREE.Mesh(sg, matBolt), nut = new THREE.Mesh(ng, matBolt);
        head.position.set(p.Ro + t + 1.5, by, dz);
        sh.position.set(p.Ro + t / 2, by, dz);
        nut.position.set(p.Ri - p.bolt * 0.4, by, dz);
        g.add(head, sh, nut);
      }
    });

    // полочка — над уголками, уходит наружу от кольца
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(shW, shT, shD), matShelf);
    shelf.position.set(xOut + t + shW / 2, shelfBottom + shT / 2, 0);
    shelf.castShadow = shelf.receiveShadow = true; g.add(shelf);

    // болты полочки к горизонтальным полкам уголков (по 2 на уголок)
    brZ.forEach(dz => {
      for (const dx of [xOut + t + 8, xOut + t + B - 8]) {
        const head = new THREE.Mesh(new THREE.CylinderGeometry(p.bolt * 0.9, p.bolt * 0.9, 3, 16), matBolt);
        head.position.set(dx, shelfBottom + shT + 1.5, dz);
        const stud = new THREE.Mesh(new THREE.CylinderGeometry(p.bolt / 2, p.bolt / 2, t + shT + 6, 12), matBolt);
        stud.position.set(dx, hLegY, dz);
        const nut = new THREE.Mesh(new THREE.CylinderGeometry(p.bolt * 0.95, p.bolt * 0.95, p.bolt * 0.8, 6), matBolt);
        nut.position.set(dx, hLegY - t - p.bolt * 0.4, dz);
        g.add(head, stud, nut);
      }
    });

    // ограждение: столбики + 2 прутка (верхний и средний)
    const r = p.rodD / 2, base = shelfBottom + shT;
    const xA = xOut + t + s.ins, xB = xA + (s.depth - 2 * s.ins);
    const zA = -(s.width / 2 - s.ins), zB = s.width / 2 - s.ins;
    const N = Math.max(0, Math.round(s.posts));
    if (N > 0) {
      const pts = perimeterPoints(xA, xB, zA, zB, N);
      pts.forEach(([px, pz]) => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(r, r, p.postH, 12), matRod);
        post.position.set(px, base + p.postH / 2, pz); post.castShadow = true; g.add(post);
      });
      for (const hy of [p.postH, p.postH / 2]) {
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          const m = rodBetween(
            new THREE.Vector3(a[0], base + hy, a[1]),
            new THREE.Vector3(b[0], base + hy, b[1]), r, matRod);
          if (m) g.add(m);
        }
      }
    }

    // условное растение на полочке
    if (p.plants) {
      const potMat = new THREE.MeshStandardMaterial({ color: 0x9a5a3a, roughness: 0.9 });
      const leaf = new THREE.MeshStandardMaterial({ color: 0x3f8a45, roughness: 0.8 });
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(38, 28, 60, 20), potMat);
      pot.position.set(xOut + t + shW / 2, base + 30, 0); pot.castShadow = true;
      const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(46, 1), leaf);
      bush.position.set(xOut + t + shW / 2, base + 90, 0); bush.castShadow = true;
      g.add(pot, bush);
    }

    const lab = document.createElement('div'); lab.className = 'lbl';
    lab.textContent = 'П' + (idx + 1) + ' ' + fmt(s.ang, 0) + '°';
    const lo = new CSS2DObject(lab);
    lo.position.set(xOut + t + s.depth, base + p.postH + 20, 0);
    g.add(lo);

    model.add(g);
  });

  // --- цепи и крюк
  if (p.chains && p.lugs) {
    const top = new THREE.Vector3(0, p.H + p.hang, 0);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(20, 3, 12, 40), matChain);
    ring.rotation.x = Math.PI / 2; ring.position.copy(top); model.add(ring);
    const hookCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 60, 0), new THREE.Vector3(0, 95, 0),
      new THREE.Vector3(18, 112, 0), new THREE.Vector3(32, 95, 0), new THREE.Vector3(28, 80, 0)]);
    const hook = new THREE.Mesh(new THREE.TubeGeometry(hookCurve, 40, 3.5, 10), matChain);
    hook.position.copy(top).add(new THREE.Vector3(0, 18, 0)); model.add(hook);
    for (let j = 0; j < p.n; j++) {
      const aj = j * p.pitch, r = p.Ri - p.t / 2;
      const eye = new THREE.Vector3(Math.cos(aj) * r, p.H + LUG.h - LUG.w / 2, -Math.sin(aj) * r);
      const tr = new THREE.Vector3(Math.cos(aj) * 18, 0, -Math.sin(aj) * 18).add(top);
      const dir = new THREE.Vector3().subVectors(tr, eye), len = dir.length(); dir.normalize();
      const step = 16, N = Math.floor(len / step);
      const geo = new THREE.TorusGeometry(6, 1.6, 6, 14); geo.scale(1, 1.6, 1);
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      for (let i = 0; i <= N; i++) {
        const m = new THREE.Mesh(geo, matChain);
        m.position.copy(eye).addScaledVector(dir, i * step); m.quaternion.copy(q);
        if (i % 2) m.rotateY(Math.PI / 2);
        m.castShadow = true; model.add(m);
      }
    }
  }

  scene.add(model);
  segButtons(p);
  drawSVG(p);
  if (dxfSheets) buildDXF(p);          // комплект DXF должен следовать за параметрами
}

function segButtons(p) {
  const box = $('segBtns'); box.innerHTML = '';
  for (let i = -1; i < p.n; i++) {
    const b = document.createElement('button');
    b.textContent = i < 0 ? 'Все' : 'С' + (i + 1);
    if (i === selected) b.className = 'on';
    b.onclick = () => { selected = i; build(); };
    box.appendChild(b);
  }
}

// выбор кликом
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downXY = null;
renderer.domElement.addEventListener('pointerdown', e => downXY = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(segMeshes)[0];
  selected = hit ? segMeshes.indexOf(hit.object) : -1;
  build();
});

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); labelR.render(scene, camera); })();

// ---------------- 2D чертёж ----------------
function drawSVG(p) {
  const W = 1180, Hh = 1560;
  const ink = '#1b1b1b';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" font-family="Arial, sans-serif" font-size="12" fill="${ink}">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,2 L10,5 L0,8 z" fill="${ink}"/></marker></defs>
  <rect x="10" y="10" width="${W - 20}" height="${Hh - 20}" fill="#fff" stroke="${ink}" stroke-width="1.5"/>`;
  const dim = (x1, y1, x2, y2, txt, tx, ty, rot = 0) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="0.6" marker-start="url(#ar)" marker-end="url(#ar)"/>` +
    `<text x="${tx}" y="${ty}" text-anchor="middle" ${rot ? `transform="rotate(${rot} ${tx} ${ty})"` : ''}>${txt}</text>`;
  const ext = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="0.4"/>`;
  const title = (x, y, t) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="14" font-weight="bold">${t}</text>`;

  // === Вид сверху кольца ===
  const cx = 290, cy = 330, k = 380 / p.D;
  s += title(cx, 52, `Вид сверху (М 1:${fmt(1 / k, 1)})`);
  s += `<line x1="${cx - p.Ro * k - 30}" y1="${cy}" x2="${cx + p.Ro * k + 30}" y2="${cy}" stroke="${ink}" stroke-width="0.4" stroke-dasharray="14 3 2 3"/>`;
  s += `<line x1="${cx}" y1="${cy - p.Ro * k - 30}" x2="${cx}" y2="${cy + p.Ro * k + 30}" stroke="${ink}" stroke-width="0.4" stroke-dasharray="14 3 2 3"/>`;
  const ro = p.Ro * k, ri = Math.max(p.Ri * k, ro - 3);
  const P = (r, a) => `${cx + r * Math.cos(a)},${cy - r * Math.sin(a)}`;
  for (let i = 0; i < p.n; i++) {
    const c = i * p.pitch + p.pitch / 2, a0 = c - p.segAng / 2, a1 = c + p.segAng / 2;
    const big = p.segAng > Math.PI ? 1 : 0;
    s += `<path d="M${P(ro, a0)} A${ro},${ro} 0 ${big} 0 ${P(ro, a1)} L${P(ri, a1)} A${ri},${ri} 0 ${big} 1 ${P(ri, a0)} Z" fill="${i === selected ? '#e0a040' : '#555'}" stroke="${ink}" stroke-width="0.8"/>`;
    const lx = cx + (ri - 26) * Math.cos(c), ly = cy - (ri - 26) * Math.sin(c);
    s += `<circle cx="${lx}" cy="${ly}" r="10" stroke="${ink}" stroke-width="0.7" fill="none"/><text x="${lx}" y="${ly + 4}" text-anchor="middle">${i + 1}</text>`;
    const aj = i * p.pitch, pa = p.Lp / p.Ri / 2, rp = ri - 3;
    s += `<path d="M${P(rp, aj - pa)} A${rp},${rp} 0 0 0 ${P(rp, aj + pa)}" stroke="#1b6fb0" stroke-width="3" fill="none"/>`;
  }
  // стойки уголков + полочки в плане (снаружи от кольца)
  p.shelves.forEach((sh, idx) => {
    const a = sh.a;
    const Rb = (p.Ro + p.angT / 2) * k, Rc = (p.Ro + p.angT + sh.depth / 2) * k;
    const tx = cx + Rc * Math.cos(a), ty = cy - Rc * Math.sin(a);
    const rot = -a * 180 / Math.PI;
    s += `<g transform="translate(${tx} ${ty}) rotate(${rot})">` +
      `<rect x="${-sh.depth * k / 2}" y="${-sh.width * k / 2}" width="${sh.depth * k}" height="${sh.width * k}" fill="#c9b487" stroke="${ink}" stroke-width="0.8"/>` +
      `<rect x="${-sh.depth * k / 2 + sh.ins * k}" y="${-sh.width * k / 2 + sh.ins * k}" width="${(sh.depth - 2 * sh.ins) * k}" height="${(sh.width - 2 * sh.ins) * k}" fill="none" stroke="#1b6fb0" stroke-width="0.8" stroke-dasharray="4 2"/></g>`;
    const lr = ro + p.angT * k + sh.depth * k + 22;
    const lx = cx + lr * Math.cos(a), ly = cy - lr * Math.sin(a);
    s += `<circle cx="${lx}" cy="${ly}" r="10" fill="#e0a040" stroke="${ink}" stroke-width="0.7"/><text x="${lx}" y="${ly + 4}" text-anchor="middle">${idx + 1}</text>`;
    // стойки уголков — поперёк, снаружи от кольца
    const nBr = Math.max(1, p.angN);
    let brZ;
    if (nBr === 1) brZ = [0];
    else {
      const step = Math.min(p.angSpan, sh.width - p.angA);
      brZ = [];
      for (let i = 0; i < nBr; i++) brZ.push(-step * (nBr - 1) / 2 + i * step);
    }
    brZ.forEach(dz => {
      const bx = cx + Rb * Math.cos(a), by = cy - Rb * Math.sin(a);
      s += `<g transform="translate(${bx} ${by}) rotate(${rot})"><rect x="${-p.angT * k / 2}" y="${dz * k - p.angA * k / 2}" width="${p.angT * k}" height="${p.angA * k}" fill="#5a6069" stroke="${ink}" stroke-width="0.6"/>` +
        `<rect x="${p.angT * k / 2}" y="${dz * k - p.angT * k / 2}" width="${p.angB * k}" height="${p.angT * k}" fill="#7a828c" stroke="${ink}" stroke-width="0.5"/></g>`;
    });
  });
  s += dim(cx - ro, cy + ro + 40, cx + ro, cy + ro + 40, `Ø${p.D}`, cx, cy + ro + 34);
  s += ext(cx - ro, cy, cx - ro, cy + ro + 46) + ext(cx + ro, cy, cx + ro, cy + ro + 46);
  s += `<text x="${cx}" y="${cy + ro + 66}" text-anchor="middle">Зазор ${p.gap} мм · ${p.n} сегм. по ${fmt(360 / p.n, 0)}°</text>`;
  s += `<text x="${cx}" y="${cy + ro + 82}" text-anchor="middle" font-size="11">1…${p.n} — сегменты, синие — накладки,</text>`;
  s += `<text x="${cx}" y="${cy + ro + 96}" text-anchor="middle" font-size="11">${p.shelves.length} — полочки с уголками</text>`;

  // === Развёртка сегмента ===
  const ox = 600, oy = 110, sk = Math.min(540 / p.L, 2.2), Lw = p.L * sk, Hw = p.H * sk;
  s += title(ox + Lw / 2, 68, `Поз. 1 — Сегмент, развёртка (${p.n} шт.)`);
  s += `<rect x="${ox}" y="${oy}" width="${Lw}" height="${Hw}" fill="#eee" stroke="${ink}" stroke-width="1.2"/>`;
  const hy = oy + Hw / 2, hr = Math.max(p.dHole / 2 * sk, 2);
  const hx = [...p.holes.map(d => ox + d * sk), ...p.holes.map(d => ox + Lw - d * sk)];
  hx.forEach(x => s += `<circle cx="${x}" cy="${hy}" r="${hr}" fill="#fff" stroke="${ink}"/><line x1="${x - hr - 4}" y1="${hy}" x2="${x + hr + 4}" y2="${hy}" stroke="${ink}" stroke-width="0.3"/><line x1="${x}" y1="${hy - hr - 4}" x2="${x}" y2="${hy + hr + 4}" stroke="${ink}" stroke-width="0.3"/>`);
  s += dim(ox, oy + Hw + 50, ox + Lw, oy + Hw + 50, fmt(p.L, 1), ox + Lw / 2, oy + Hw + 44);
  s += ext(ox, oy + Hw, ox, oy + Hw + 56) + ext(ox + Lw, oy + Hw, ox + Lw, oy + Hw + 56);
  s += dim(ox, oy + Hw + 22, hx[0], oy + Hw + 22, p.holes[0], ox + (hx[0] - ox) / 2, oy + Hw + 16);
  s += dim(hx[0], oy + Hw + 22, hx[1], oy + Hw + 22, fmt(p.holes[1] - p.holes[0], 0), (hx[0] + hx[1]) / 2, oy + Hw + 16);
  s += ext(hx[0], hy, hx[0], oy + Hw + 28) + ext(hx[1], hy, hx[1], oy + Hw + 28);
  s += dim(ox + Lw + 22, oy, ox + Lw + 22, oy + Hw, p.H, ox + Lw + 36, oy + Hw / 2 + 4, -90);
  s += ext(ox + Lw, oy, ox + Lw + 28, oy) + ext(ox + Lw, oy + Hw, ox + Lw + 28, oy + Hw);
  s += `<text x="${ox}" y="${oy + Hw + 80}">${p.n * 4} отв. Ø${p.dHole} на оси полосы. Вальцевать по R${fmt(p.Ro, 0)} (наружн.).</text>`;
  s += `<text x="${ox}" y="${oy + Hw + 96}">Хорда ${fmt(p.chord, 1)}, стрела ${fmt(p.sag, 1)} мм — контрольный шаблон.</text>`;

  // === Накладка ===
  const px = 600, py = 440, pk = 3, Pw = p.Lp * pk, Ph = p.H * pk;
  const lh = p.lugs ? LUG.h * pk : 0, lw = LUG.w / 2 * pk;
  s += title(px + Pw / 2, py - lh - 30, `Поз. 2 — Накладка${p.lugs ? ' с проушиной' : ''} (${p.n} шт.) М 3:1`);
  let path = `M${px},${py} L${px + Pw},${py} L${px + Pw},${py + Ph} L${px},${py + Ph} Z`;
  if (p.lugs) {
    const mx = px + Pw / 2, top = py - lh + lw;
    path = `M${px},${py + Ph} L${px},${py} L${mx - lw},${py} L${mx - lw},${top} A${lw},${lw} 0 0 1 ${mx + lw},${top} L${mx + lw},${py} L${px + Pw},${py} L${px + Pw},${py + Ph} Z`;
  }
  s += `<path d="${path}" fill="#e6eef5" stroke="${ink}" stroke-width="1.2"/>`;
  if (p.lugs) {
    const mx = px + Pw / 2, top = py - lh + lw;
    s += `<circle cx="${mx}" cy="${top}" r="${LUG.hole / 2 * pk}" fill="#fff" stroke="${ink}"/>`;
    s += `<text x="${mx + lw + 10}" y="${top + 4}">Ø${LUG.hole}</text>`;
    s += dim(px - 22, py - lh, px - 22, py, LUG.h, px - 36, py - lh / 2 + 4, -90) + ext(px - 28, py - lh, mx - lw, py - lh);
  }
  const phy = py + Ph / 2, mid = px + Pw / 2, g2 = p.gap / 2 * pk;
  const phx = [...p.holes.map(d => mid - g2 - d * pk), ...p.holes.map(d => mid + g2 + d * pk)];
  phx.forEach(x => s += `<circle cx="${x}" cy="${phy}" r="${p.dHole / 2 * pk}" fill="#fff" stroke="${ink}"/>`);
  s += `<line x1="${mid}" y1="${py - 6}" x2="${mid}" y2="${py + Ph + 6}" stroke="${ink}" stroke-width="0.4" stroke-dasharray="10 3 2 3"/>`;
  s += dim(px, py + Ph + 44, px + Pw, py + Ph + 44, p.Lp, mid, py + Ph + 38) + ext(px, py + Ph, px, py + Ph + 50) + ext(px + Pw, py + Ph, px + Pw, py + Ph + 50);
  const sorted = [...phx].sort((a, b) => a - b);
  s += dim(sorted[1], py + Ph + 20, sorted[2], py + Ph + 20, fmt(p.holes[0] * 2 + p.gap, 0), mid, py + Ph + 14);
  sorted.slice(1, 3).forEach(x => s += ext(x, phy, x, py + Ph + 26));
  s += dim(px + Pw + 22, py, px + Pw + 22, py + Ph, p.H, px + Pw + 36, phy + 4, -90);
  s += `<text x="${px}" y="${py + Ph + 72}">4 отв. Ø${p.dHole}. Вальцевать по R${fmt(p.Ri, 0)}.</text>`;

  // === Полочка, план ===
  if (p.shelves.length) {
    const sh = p.shelves[0];
    const gx = 620, gy = 560, gk = Math.min(300 / sh.depth, 300 / sh.width, 2);
    const gw = sh.depth * gk, gd = sh.width * gk;
    s += title(gx + gw / 2, gy - 40, `Поз. 4 — Полочка с ограждением, план (${p.shelves.length} шт.) М ${fmt(gk, 0)}:1`);
    s += `<rect x="${gx}" y="${gy}" width="${gw}" height="${gd}" fill="#e7ddc7" stroke="${ink}" stroke-width="1.2"/>`;
    const ax = gx + sh.ins * gk, ay = gy + sh.ins * gk;
    const aw = (sh.depth - 2 * sh.ins) * gk, ah = (sh.width - 2 * sh.ins) * gk;
    s += `<rect x="${ax}" y="${ay}" width="${aw}" height="${ah}" fill="none" stroke="#1b6fb0" stroke-width="1" stroke-dasharray="5 3"/>`;
    const pts = perimeterPoints(ax, ax + aw, ay, ay + ah, sh.posts);
    pts.forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="${p.rodD / 2 * gk}" fill="#fff" stroke="${ink}"/>`);
    s += dim(gx, gy + gd + 24, gx + gw, gy + gd + 24, sh.depth, gx + gw / 2, gy + gd + 18);
    s += ext(gx, gy + gd, gx, gy + gd + 30) + ext(gx + gw, gy + gd, gx + gw, gy + gd + 30);
    s += dim(gx + gw + 26, gy, gx + gw + 26, gy + gd, sh.width, gx + gw + 40, gy + gd / 2 + 4, -90);
    s += ext(gx + gw, gy, gx + gw + 32, gy) + ext(gx + gw, gy + gd, gx + gw + 32, gy + gd);
    s += `<text x="${gx}" y="${gy + gd + 44}">Пруток Ø${p.rodD} — столбики ${sh.posts} шт × ${p.postH} мм, пруток по периметру (верх + середина).</text>`;
    s += `<text x="${gx}" y="${gy + gd + 60}">Полочка из полосы/листа ${p.shT} мм. Длина прутка на полочку ${fmt(sh.rodLen / 1000, 2)} м.</text>`;
    let tt = `<text x="${gx}" y="${gy + gd + 80}" font-size="12" font-weight="bold">Размеры полочек</text>`;
    tt += `<text x="${gx}" y="${gy + gd + 98}" fill="#666">№  Угол  Глуб.  Ширина  Столб.</text>`;
    p.shelves.forEach((q, i) => {
      tt += `<text x="${gx}" y="${gy + gd + 116 + i * 16}">${i + 1}   ${fmt(q.ang, 0)}°   ${q.depth}   ${q.width}   ${q.posts}</text>`;
    });
    s += tt;
  }

  // === Сечение узла (кольцо + стойка уголка вниз + полочка) ===
  {
    const nx = 60, ny = 1010, ns = 2.4;
    const XR = nx + 40;                         // внутренняя стенка кольца (X), наружу = вправо
    const SY = y => ny + (p.H - y) * ns;        // отметка → экран (вверх = минус)
    s += title(nx + 200, ny - 40, `Сечение узла (М ${fmt(ns, 1)}:1)`);
    s += `<rect x="${XR}" y="${ny}" width="${p.t * ns}" height="${p.H * ns}" fill="#555" stroke="${ink}"/>`;
    const vx = XR + p.t * ns;                   // стойка уголка снаружи кольца
    const drop = p.angDrop;
    s += `<rect x="${vx}" y="${ny}" width="${p.angT * ns}" height="${drop * ns}" fill="#7a828c" stroke="${ink}"/>`;
    // горизонтальная полка уголка — наружу от стойки, под полочкой
    const hx = vx;
    s += `<rect x="${hx}" y="${ny + drop * ns}" width="${p.angB * ns}" height="${p.angT * ns}" fill="#7a828c" stroke="${ink}"/>`;
    // полочка — выше горизонтальной полки, наружу от кольца
    const shW = (p.shelves.length ? p.shelves[0].depth : 150) * ns;
    const shY = ny + drop * ns - p.shT * ns;
    s += `<rect x="${vx}" y="${shY}" width="${shW}" height="${p.shT * ns}" fill="#c9b487" stroke="${ink}"/>`;
    if (p.shelves.length) {
      const sh = p.shelves[0], base = -drop;
      const pxA = vx + sh.ins * ns, pxB = vx + (sh.depth - sh.ins) * ns;
      const pyA = SY(base + p.postH), pyB = SY(base);
      s += `<rect x="${pxA}" y="${pyA}" width="${pxB - pxA}" height="${pyB - pyA}" fill="none" stroke="#1b6fb0" stroke-width="0.8" stroke-dasharray="4 2"/>`;
      const pts = perimeterPoints(pxA, pxB, pyA, pyB, sh.posts);
      pts.forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="${p.rodD / 2 * ns}" fill="#fff" stroke="${ink}"/>`);
      s += dim(pxB + 30, pyA, pxB + 30, pyB, p.postH, pxB + 44, (pyA + pyB) / 2 + 4, -90);
      s += dim(vx, pyB + 34, vx + shW, pyB + 34, sh.depth, vx + shW / 2, pyB + 28);
      s += dim(hx, ny + drop * ns + p.angT * ns + 34, hx + p.angB * ns, ny + drop * ns + p.angT * ns + 34, p.angB, hx + p.angB * ns / 2, ny + drop * ns + p.angT * ns + 28);
    }
    s += dim(XR - 14, ny, XR - 14, ny + p.H * ns, p.H, XR - 28, ny + p.H * ns / 2 + 4, -90);
    s += dim(vx + p.angT * ns + 14, ny, vx + p.angT * ns + 14, ny + drop * ns, drop, vx + p.angT * ns + 28, ny + drop * ns / 2 + 4, -90);
    s += `<text x="${nx}" y="${ny + p.H * ns + 26}">Кольцо ${p.t}×${p.H} · стойка уголка ${p.angT}×${p.angA}, выпуск ${drop} мм · полочка ${p.shT} мм · пруток Ø${p.rodD}</text>`;
    s += `<text x="${nx}" y="${ny + p.H * ns + 42}">Уголок снаружи кольца: вертикальная стойка идёт вниз, горизонтальная полка — наружу, под полочку.</text>`;
    s += `<text x="${nx}" y="${ny + p.H * ns + 58}">Стойка крепится к кольцу 2×M${p.bolt} сквозь полосу (снаружи); полочка — 2×M${p.bolt} к горизонтальной полке.</text>`;
    s += `<text x="${nx}" y="${ny + p.H * ns + 74}">Столбики ограждения приварены к полочке. Уголков на полочку — ${p.angN}.</text>`;
  }

  // === Сечение полосы ===
  {
    const sx = 60, sy = 1240, ss = 3;
    s += title(sx, sy - 14, 'Сечение полосы кольца (М 3:1)');
    s += `<rect x="${sx + 30}" y="${sy}" width="${p.t * ss}" height="${p.H * ss}" fill="#555" stroke="${ink}"/>`;
    s += dim(sx + 10, sy, sx + 10, sy + p.H * ss, p.H, sx, sy + p.H * ss / 2 + 4, -90);
    s += `<text x="${sx + 50}" y="${sy + 16}">t=${p.t} (кольцо)</text>`;
    s += `<text x="${sx + 50}" y="${sy + 34}">наружная сторона →</text>`;
  }

  // === Штамп ===
  {
    const tx = 600, ty = 1290, tw = 560;
    s += `<rect x="${tx}" y="${ty}" width="${tw}" height="200" fill="none" stroke="${ink}" stroke-width="1.2"/>`;
    const lines = [
      ['Изделие', 'Цветочный подвес. Кольцо сборное с полочками'],
      ['Кольцо', `Ø${p.D} × ${p.H} мм, ${p.n} сегм., зазор ${p.gap} мм`],
      ['Полочки', `${p.shelves.length} шт: ` + p.shelves.map(q => `${fmt(q.ang, 0)}°/${q.depth}×${q.width}`).join(', ')],
      ['Уголок', `${p.angT}×${p.angA}, стойка ${p.angDrop} мм, ${p.shelves.length * p.angN} шт`],
      ['Ограждение', `Пруток Ø${p.rodD}, столбики ${p.postH} мм`],
      ['Материал', `${p.mat}; полоса ${p.t}×${p.H}, лист ${p.shT} мм`],
      ['Крепёж', `M${p.bolt} — ${p.bolts} компл.`],
      ['Масса', `${fmt(p.mTotal, 2)} кг (без цепей)`],
    ];
    lines.forEach((l, i) => {
      const y = ty + 22 + i * 22;
      s += `<text x="${tx + 10}" y="${y}" fill="#666">${l[0]}</text><text x="${tx + 105}" y="${y}">${l[1]}</text>`;
      if (i) s += `<line x1="${tx}" y1="${y - 16}" x2="${tx + tw}" y2="${y - 16}" stroke="${ink}" stroke-width="0.3"/>`;
    });
    s += `<line x1="${tx + 95}" y1="${ty}" x2="${tx + 95}" y2="${ty + 200}" stroke="${ink}" stroke-width="0.3"/>`;
  }

  s += '</svg>';
  $('v2d').innerHTML = s;
}

// ---------------- Комплект чертежей DXF ----------------
let dxfSheets = null;                 // текущий сгенерированный комплект

function dxfFileName(sh) {
  return `Цветочный_подвес_${sh.code}_${sh.name.replace(/[^\wа-яА-ЯёЁ]+/g, '_')}.dxf`;
}

// пересобрать комплект под текущие параметры
function buildDXF(p) {
  dxfSheets = buildSheets(p).map(sh => {
    const dr = { items: sh.items };
    return { ...sh, dr, dxf: toDXF(dr), svg: toSVG(dr, 420, 297) };
  });
  renderDXF(p);
}

function renderDXF(p) {
  const box = $('vdxf');
  if (!dxfSheets) { box.innerHTML = '<p class="hint">Нажмите «Собрать комплект».</p>'; return; }
  const total = dxfSheets.reduce((a, s) => a + s.dxf.length, 0);
  let h = `<div class="bar"><b>Комплект чертежей — ${dxfSheets.length} листа A3</b>` +
    `<span style="color:#666;font-size:12px">кольцо Ø${p.D}×${p.H} мм, ${p.n} сегм., полочек ${p.shelves.length}, масса ${fmt(p.mTotal, 2)} кг</span>` +
    `<span style="flex:1"></span>` +
    `<button class="btn" id="dxfZip">Скачать комплект (ZIP)</button>` +
    `<button class="btn" id="dxfAll">Скачать все DXF</button></div>`;
  h += `<p class="hint">Формат DXF R12 (AC1009), единицы — миллиметры, кодировка текста ANSI_1251 (кириллица читается в AutoCAD, BricsCAD, nanoCAD, «Компас-3D»). ` +
    `Слои: КОНТУР, ОСЕВАЯ, РАЗМЕРЫ, ТЕКСТ, ОТВЕРСТИЯ, ТАБЛИЦА. Предпросмотр ниже — фактическое содержание файлов.</p>`;
  h += `<div class="sheet">`;
  for (const sh of dxfSheets) {
    h += `<div class="card"><h4>${sh.code} · ${sh.name} <span>${(sh.dxf.length / 1024).toFixed(1)} КБ</span></h4>` +
      sh.svg +
      `<div class="row"><button class="btn sm" data-dxf="${sh.code}">Скачать DXF</button>` +
      `<button class="btn sm" data-svg="${sh.code}">Скачать SVG</button>` +
      `<small>${sh.dxf.length} байт</small></div></div>`;
  }
  h += `</div>`;
  box.innerHTML = h;

  $('dxfZip').onclick = () => {
    const files = dxfSheets.map(sh => ({ name: dxfFileName(sh), data: sh.dxf }));
    files.push({ name: 'Ведомость_комплекта.txt', data: dxfReadme(p) });
    const blob = zipSync(files);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `Цветочный_подвес_D${p.D}_${p.n}сегм_${p.shelves.length}пол.DXF.zip`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  $('dxfAll').onclick = () => {
    for (const sh of dxfSheets) downloadBytes(sh.dxf, dxfFileName(sh));
  };
  box.querySelectorAll('[data-dxf]').forEach(b => b.onclick = () => {
    const sh = dxfSheets.find(s => s.code === b.dataset.dxf);
    downloadBytes(sh.dxf, dxfFileName(sh));
  });
  box.querySelectorAll('[data-svg]').forEach(b => b.onclick = () => {
    const sh = dxfSheets.find(s => s.code === b.dataset.svg);
    downloadBytes(new TextEncoder().encode(sh.svg), dxfFileName(sh).replace(/\.dxf$/, '.svg'));
  });
}

function downloadBytes(bytes, name) {
  const blob = new Blob([bytes], { type: 'application/dxf' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function dxfReadme(p) {
  return [
    'КОМПЛЕКТ ЧЕРТЕЖЕЙ «ЦВЕТОЧНЫЙ ПОДВЕС»',
    'Формат: DXF R12 (AC1009). Единицы: миллиметры. Кодировка текста: ANSI_1251.',
    '',
    `Кольцо: Ø${p.D} × ${p.H} мм, полоса ${p.t} мм, ${p.n} сегм., зазор ${p.gap} мм.`,
    `Развёртка сегмента: ${p.L.toFixed(1)} мм; угол вальцовки ${(p.segAng * 180 / Math.PI).toFixed(2)}°.`,
    `Хорда ${p.chord.toFixed(1)} мм, стрела прогиба ${p.sag.toFixed(1)} мм.`,
    `Полочек: ${p.shelves.length}; уголков ${p.shelves.length * p.angN}; прутка Ø${p.rodD} — ${p.shelves.reduce((a, s) => a + s.rodLen / 1000, 0).toFixed(2)} м.`,
    `Крепёж: ${p.bolts} шт. М${p.bolt}.`,
    `Масса изделия: ${p.mTotal.toFixed(2)} кг. Окраска: ${p.paint.toFixed(3)} м².`,
    '',
    'ЛИСТЫ:',
    ...dxfSheets.map((s, i) => `  ${i + 1}. ${s.code} — ${s.name} (${dxfFileName(s)})`),
    '',
    'Слои: КОНТУР (7), ОСЕВАЯ (1), РАЗМЕРЫ (3), ТЕКСТ (4), ОТВЕРСТИЯ (5), ТАБЛИЦА (6).',
    'Формат листа: A3 (420×297 мм).',
  ].join('\r\n');
}

// ---------------- UI ----------------
document.querySelectorAll('aside input, aside select').forEach(el => {
  if (el.closest('#shTable')) return;
  el.addEventListener('input', build);
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  const tab = b.dataset.tab;
  $('v3d').style.display = tab === '3d' ? '' : 'none';
  $('v2d').style.display = tab === '2d' ? 'block' : 'none';
  $('vdxf').style.display = tab === 'dxf' ? 'block' : 'none';
  $('hud').style.display = tab === '3d' ? '' : 'none';
  if (tab === 'dxf' && !dxfSheets) buildDXF(params());
});
$('dl').onclick = () => {
  const blob = new Blob([$('v2d').innerHTML], { type: 'image/svg+xml' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `podves_D${$('D').value}_${$('n').value}seg_${shelves.length}pol.svg`; a.click();
};
renderShelfTable();
build(); resize();
window.__fh = { scene, camera, controls, THREE };   // для отладки и внешних скриптов
</script>
</body>
</html>
